name: trigger

# Polls the dead-man-switch state daily and self-gates: it only fires the
# death actions when the aggregate has marked the state trigger_ready.
# Deliberately not named "*-check.yaml" so the aggregate does not count it
# as a life signal.
#
# The encrypted payloads + actions.json live in a sibling private repo
# (named via the BLOBS_REPO secret) so the ciphertext never sits in a
# public history where it could be harvested for a future
# decrypt-the-past attack. The deploy key in BLOBS_DEPLOY_KEY is
# read-only scoped to that one repo.

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"

permissions:
  contents: read

jobs:
  fire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: ${{ secrets.BLOBS_REPO }}
          ssh-key: ${{ secrets.BLOBS_DEPLOY_KEY }}
          path: blobs
          ref: main
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go run ./trigger
        env:
          ACTIONS_FILE: blobs/actions.json
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          # email death-action handler (#6) configuration
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          OPERATOR_NAME: ${{ vars.OPERATOR_NAME }}
          EMAIL_SEND_DELAY_SECONDS: ${{ vars.EMAIL_SEND_DELAY_SECONDS }}
