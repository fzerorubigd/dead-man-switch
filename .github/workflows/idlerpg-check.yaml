name: I am alive check IdleRPG
on: 
  workflow_dispatch:
  schedule:
  - cron: "0 1 * * *"

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: |
          go run ./signal/idlerpg