name: email test

# Operator-on-demand dry run of the email death-trigger flow. It bypasses
# the state gate and sends every recipient's rendered email to the
# OPERATOR's own address (decrypted from operator-self.gpg), with the
# intended recipient in a footer. Email actions only — never the
# destructive handlers — so this is safe to fire while alive.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: ${{ secrets.BLOBS_REPO }}
          ssh-key: ${{ secrets.BLOBS_DEPLOY_KEY }}
          path: blobs
          ref: main
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: send test emails to the operator
        env:
          ACTIONS_FILE: blobs/actions.json
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          TRIGGER_TEST_MODE: "true"
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          OPERATOR_NAME: ${{ vars.OPERATOR_NAME }}
          EMAIL_SEND_DELAY_SECONDS: ${{ vars.EMAIL_SEND_DELAY_SECONDS }}
        run: |
          set -euo pipefail
          # The operator's own address comes from the encrypted operator-self
          # blob; mask it so it never lands in the logs.
          EMAIL_TEST_TO="$(go run ./cmd/lt-crypt decrypt --in blobs/operator-self.gpg | jq -r '.email')"
          echo "::add-mask::$EMAIL_TEST_TO"
          test -n "$EMAIL_TEST_TO"
          EMAIL_TEST_TO="$EMAIL_TEST_TO" go run ./trigger
