name: I am alive check Boardgamegeek
on: 
  workflow_dispatch:
  schedule:
  - cron: "0 3 * * *"

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: |
          go run ./signal/bggplays
        env:
          BGG_TOKEN: ${{ secrets.BGG_TOKEN }}